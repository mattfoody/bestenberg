name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_INSTALL: pnpm install --frozen-lockfile

jobs:
  js:
    name: JS (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: ${{ env.PNPM_INSTALL }}
      - run: bin/ci-run.sh 'ESLint/Prettier' bash -c 'pnpm lint:js || { pnpm exec prettier --write . >/dev/null; git --no-pager diff; exit 1; }'
      - run: bin/ci-run.sh 'Typecheck' pnpm typecheck
      - run: bin/ci-run.sh 'Vitest' pnpm test
      - run: bin/ci-run.sh 'Build' pnpm build
      - name: Verify editor build output
        run: |
          echo "::notice title=Editor build::$(ls wp/plugin/build/editor 2>&1 | tr '\n' ' ')"
          test -f wp/plugin/build/editor/index.js && test -f wp/plugin/build/editor/index.asset.php && test -f wp/plugin/build/editor/index.css
      - name: Generated files are up to date
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error title=Stale generated files::Run 'pnpm build' (or 'pnpm generate') and commit the result."
            exit 1
          fi

  php:
    name: PHP ${{ matrix.php }} (PHPCS, PHPStan)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    defaults:
      run:
        working-directory: wp/plugin
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: ../../bin/ci-run.sh 'Composer install' composer install --no-interaction --no-progress
      - run: ../../bin/ci-run.sh 'PHPCS' composer lint
      - run: ../../bin/ci-run.sh 'PHPStan' composer stan

  wordpress:
    name: WordPress (PHPUnit PHP ${{ matrix.php }}${{ matrix.e2e && ', e2e' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            e2e: false
          - php: '8.3'
            e2e: true
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: ${{ env.PNPM_INSTALL }}
      - run: composer --working-dir=wp/plugin install --no-interaction --no-progress
      - run: bin/ci-run.sh 'Build' pnpm build
      - name: Verify editor build output
        run: |
          echo "::notice title=Editor build::$(ls wp/plugin/build/editor 2>&1 | tr '\n' ' ')"
          test -f wp/plugin/build/editor/index.js && test -f wp/plugin/build/editor/index.asset.php && test -f wp/plugin/build/editor/index.css
      - name: Start wp-env
        run: bin/ci-run.sh 'wp-env start' pnpm exec wp-env start
      - name: Verify plugin, theme and WooCommerce are active
        run: |
          pnpm exec wp-env run cli wp plugin is-active bestenberg
          pnpm exec wp-env run cli wp plugin is-active woocommerce
          test "$(pnpm exec wp-env run cli wp theme list --status=active --field=name 2>/dev/null | tail -1)" = "bestenberg"
      - name: PHPUnit
        run: bin/ci-run.sh 'PHPUnit' pnpm test:php
      - name: Install Playwright browser
        if: matrix.e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke
        if: matrix.e2e
        run: bin/ci-run.sh 'Playwright' pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.e2e
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
