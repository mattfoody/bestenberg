name: Refresh composer.lock

# Manually triggered: re-resolves wp/plugin/composer.lock for the minimum
# supported PHP (config.platform) and commits it to the current branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      - name: Update lock file
        working-directory: wp/plugin
        run: composer update --no-interaction --no-progress
      - name: Commit if changed
        run: |
          if git diff --quiet -- wp/plugin/composer.lock; then
            echo "composer.lock already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp/plugin/composer.lock
          git commit -m "Refresh composer.lock for PHP 8.1"
          git push
